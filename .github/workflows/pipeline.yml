name: Daily pipeline

on:
  schedule:
    - cron: "0 13 * * *"   # 07:00 in Mazatlán
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Extract → Load → dbt build (tests gate the publish) → Report
        run: python -m pipeline.run
      - name: dbt docs (lineage graph)
        run: |
          dbt docs generate --project-dir transform --profiles-dir transform --static
          mkdir -p docs/dbt && cp transform/target/static_index.html docs/dbt/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
