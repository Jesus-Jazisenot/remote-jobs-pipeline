[project]
name = "remote-jobs-pipeline"
version = "1.0.0"
description = "Daily ELT pipeline: public job APIs -> DuckDB -> dbt (models + data tests) -> static report on GitHub Pages."
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "dbt-core>=1.9", "dbt-duckdb>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["transform"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # long lines live only in the HTML template

[tool.pytest.ini_options]
testpaths = ["tests"]
